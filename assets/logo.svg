<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">cleaner-secure</title>
  <desc id="desc">Escudo cian y azul con acento rojo sobre fondo negro.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050b14"/>
      <stop offset="1" stop-color="#0d1a2b"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="slash" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#b91c1c"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="84" fill="none" stroke="#164e63" stroke-width="4"/>

  <path d="M256 62 L402 116 V260 C402 355 337 421 256 452 C175 421 110 355 110 260 V116 Z"
        fill="#071422" stroke="url(#shield)" stroke-width="18" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M256 86 L378 132 V260 C378 339 328 397 256 426 C184 397 134 339 134 260 V132 Z"
        fill="none" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="4"/>

  <path d="M160 336 L352 144" stroke="url(#slash)" stroke-width="34" stroke-linecap="round"/>
  <path d="M160 336 L352 144" stroke="#fca5a5" stroke-opacity="0.65" stroke-width="6" stroke-linecap="round"/>

  <circle cx="256" cy="240" r="58" fill="#050b14" stroke="#67e8f9" stroke-width="8"/>
  <path d="M256 198 V282 M214 240 H298" stroke="#67e8f9" stroke-width="10" stroke-linecap="round"/>
  <circle cx="256" cy="240" r="14" fill="#ef4444"/>
</svg>
